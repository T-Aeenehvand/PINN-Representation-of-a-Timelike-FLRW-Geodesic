[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flrw-geodesic-pinn"
version = "1.0.0"
description = "Reproducibility package for a geometry-aware PINN study of FLRW geodesics"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "torch==2.10.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
